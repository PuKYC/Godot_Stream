# .github/workflows/publish-release.yml
name: Publish Release

on:
  # 手动触发（在 Actions 页面输入 tag）
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g., v1.0.0)"
        required: true
        type: string

  # GitHub Release 发布时自动触发
  release:
    types: [published]

jobs:
  # 1. 调用已有的构建流程（会生成所有平台的 addons 产物）
  call-build:
    uses: ./.github/workflows/make_build.yml

  # 2. 下载构建产物并上传到 Release
  upload-release:
    runs-on: ubuntu-latest
    needs: call-build
    permissions:
      contents: write # 上传 Release 资产必需
    steps:
      - name: Download merged artifact
        uses: actions/download-artifact@v4
        with:
          name: godot-cpp-template
          path: artifact

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Prepare release asset
        run: |
          cd artifact
          zip -r ../WorldStream-${{ steps.tag.outputs.tag }}.zip addons/

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: WorldStream-${{ steps.tag.outputs.tag }}.zip
