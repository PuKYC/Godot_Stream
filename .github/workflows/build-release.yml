name: Release GDExtension Addons

on:
  release:
    types: [published]

jobs:
  # 调用可重用构建工作流
  call-build:
    uses: ./.github/workflows/make_build.yml
    # 无需传递任何参数，矩阵已在 make_build.yml 中定义

  # 合并所有平台产物并发布
  merge-and-release:
    runs-on: ubuntu-22.04
    needs: call-build
    permissions:
      contents: write # 用于上传 Release 资产

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all addons artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: addons-*
          path: ./artifacts

      - name: Merge all addons into project/addons
        run: |
          for dir in ./artifacts/addons-*; do
            [ -d "$dir" ] && cp -rn "$dir"/* project/addons/ 2>/dev/null || true
          done

      - name: Package addons folder (without project/ prefix)
        run: |
          cd project
          zip -r ../addons-${{ github.event.release.tag_name }}.zip addons

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: addons-${{ github.event.release.tag_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
